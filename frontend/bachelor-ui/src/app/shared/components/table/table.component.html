<div class="container">
  <div class="header">
  <mat-form-field appearance="fill">
    <input matInput (keyup)="applyFilter($event)" placeholder="Search">
    <mat-icon fontIcon="search" matSuffix></mat-icon>
  </mat-form-field>
  <button mat-raised-button (click)="openDialog()" style="font-size: 16px; background: #676883; color: #fffffc">Add {{title}}</button>
  </div>
  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
  <ng-container *ngFor="let column of columns" [matColumnDef]="column.columnDef">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ column.header }}</th>
      <td mat-cell *matCellDef="let row">
        <ng-container *ngIf="column.columnDef === 'toPlan'; else defaultCell">
          <mat-checkbox [(ngModel)]="row.toPlan" (change)="onCheckboxChange(row)"></mat-checkbox>
        </ng-container>
        <ng-template #defaultCell>{{ column.cell(row) }}</ng-template>
      </td>
    </ng-container>

    <!-- Дополнительная колонка для действий -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let row">
        <button mat-button (click)="onEdit(row)">
          <mat-icon fontIcon="edit"></mat-icon>
        </button>
        <button mat-button (click)="onDelete(row)">
          <mat-icon fontIcon="delete"></mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
